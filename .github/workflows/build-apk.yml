name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk time-machine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: time-machine.apk
          archive: false
          if-no-files-found: error
